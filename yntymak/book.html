<body data-page="book">
<main>

<div class="page"><div class="wrap"><h1>Заявка в мотосервис</h1><p>Четыре коротких шага. Текст уйдёт в WhatsApp сервиса, там договоритесь о времени.</p></div></div>
<div class="wrap flow"><form class="form" novalidate>
<fieldset><legend><i>1</i>Мотоцикл</legend><input id="bike" autocomplete="off" placeholder="Например, Honda Dio" aria-label="Марка и модель мотоцикла"></fieldset>
<fieldset><legend><i>2</i>Что случилось или какая услуга</legend><div class="chips" id="svc"></div><textarea id="note" rows="3" placeholder="Своими словами: не заводится, стучит, нужна замена масла" aria-label="Что случилось, своими словами"></textarea></fieldset>
<fieldset><legend><i>3</i>Когда удобно</legend><div class="chips" id="days"></div><div class="chips" id="times"></div></fieldset>
<fieldset><legend><i>4</i>Ваше имя</legend><input id="name" autocomplete="given-name" placeholder="Как к вам обращаться" aria-label="Имя"></fieldset>
</form>
<aside class="order" aria-label="Ваша заявка"><h3>Ваша заявка</h3><dl><div><dt>Мотоцикл</dt><dd id="o-bike">—</dd></div><div><dt>Что нужно</dt><dd id="o-svc">—</dd></div><div><dt>Когда</dt><dd id="o-when">—</dd></div><div><dt>Имя</dt><dd id="o-name">—</dd></div></dl><p class="err" role="alert"></p><button class="btn" id="send" type="button">Отправить в WhatsApp</button><small>Откроется WhatsApp с готовым текстом</small></aside></div>

</main>
<script src="assets/app.js?v=1"></script>
