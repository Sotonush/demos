<body data-page="book">
<main>

<div class="page"><div class="wrap"><p class="tag">Заявка в сервис</p><h1>Что с машиной</h1><p>Заполните наряд. Текст уйдёт в WhatsApp сервиса, там и договоритесь о времени.</p></div></div>
<div class="wrap flow"><form class="sheet" onsubmit="return false" novalidate>
<fieldset><legend><i>1</i>Марка и модель</legend><input id="car" autocomplete="off" placeholder="Например, Hyundai Porter" aria-label="Марка и модель"></fieldset>
<fieldset><legend><i>2</i>Что случилось</legend><div class="chips" id="svc"></div><textarea id="note" rows="3" placeholder="Своими словами: когда началось, что горит на панели" aria-label="Что случилось, своими словами"></textarea></fieldset>
<fieldset><legend><i>3</i>Когда удобно</legend><div class="chips days" id="days"></div><div class="chips" id="times"></div></fieldset>
<fieldset><legend><i>4</i>Ваше имя</legend><input id="name" autocomplete="given-name" placeholder="Как к вам обращаться" aria-label="Имя"></fieldset>
</form>
<aside class="order" aria-label="Ваша заявка"><span class="seal" aria-hidden="true">Заявка<br>готова</span><h3>Заявка</h3><dl><div><dt>Машина</dt><dd id="o-car">—</dd></div><div><dt>Что случилось</dt><dd id="o-svc">—</dd></div><div><dt>Когда</dt><dd id="o-when">—</dd></div><div><dt>Имя</dt><dd id="o-name">—</dd></div></dl><p class="err" role="alert"></p><button class="btn dark" id="send" type="button">Отправить в WhatsApp</button><small>Откроется WhatsApp с готовым текстом</small></aside></div>

</main>
<script src="assets/app.js?v=1"></script>
