<body data-page="book">
<main>

<div class="wrap page"><h1>Заявка</h1><p>Три ответа, и мастер сразу поймёт, что случилось. Спешите? <a href="tel:+996755392498">Позвоните</a>.</p></div>
<div class="wrap form">
<div class="step"><label for="car"><i>1</i>Марка и модель</label><input id="car" autocomplete="off" placeholder="Например, Toyota Camry 50"></div>
<div class="step"><label for="note"><i>2</i>Что случилось</label><div class="chips" id="sym"></div><input id="note" autocomplete="off" placeholder="Своими словами, если нужно"></div>
<div class="step"><span class="lab"><i>3</i>Машина на ходу?</span><div class="seg" id="mode"><button type="button" data-m="call" aria-pressed="false">Стоит, нужен мастер</button><button type="button" data-m="come" aria-pressed="false">Приеду сам</button></div>
<div id="where" hidden><label class="sub" for="place">Где машина</label><input id="place" autocomplete="off" placeholder="Адрес или ориентир"><button type="button" class="geo" id="geo">Определить, где я</button></div>
<div id="when" hidden><label class="sub" for="time">Когда приедете</label><div class="chips" id="soon"></div><input id="time" autocomplete="off" placeholder="Или напишите время"></div></div>
<div class="ticket" aria-label="Текст заявки"><span class="tag">Так увидит мастер</span><pre id="preview"></pre></div>
<p class="err" role="alert"></p>
<button class="send" id="send" type="button">Отправить в WhatsApp</button>
</div>

</main>
<script src="assets/app.js?v=1"></script>
